name: CI

# Changes are made on branches and merged through pull requests; `main` is checked again after the
# merge. The branch ruleset requires the single "CI result" check. Documentation-only changes skip
# the heavy jobs inside the workflow rather than skipping the workflow: a workflow that never runs
# leaves a required check pending forever, a skipped job counts as passed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels the older run. Every commit on `main` gets its own run:
# a shared group would cancel or skip a pending one, leaving that commit unchecked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No job writes to the repository, and checkouts do not keep the token.
permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Anything besides docs/, Markdown and LICENSE?
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # New branch, manual run or an unknown base: check everything.
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a rename lists its old path too, so moving code under docs/ is a code change.
          git diff --name-only --no-renames "$BASE" "$GITHUB_SHA"
          code=$(git diff --name-only --no-renames "$BASE" "$GITHUB_SHA" | grep -v -E '^docs/|\.md$|^LICENSE$' | head -1)
          echo "code=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  typescript:
    name: TypeScript (types, lint, format, unit tests, bundle)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Biome (lint + format)
        run: npx --no-install biome ci .

      - name: Translations
        run: npm run i18n:check

      - name: Manifest
        run: npm run check:manifest

      - name: Unit and contract tests
        run: npm run test:unit

      - name: Committed bundle is up to date
        run: |
          npm run build
          git diff --exit-code -- lib/tracker.mjs || {
            echo "::error file=lib/tracker.mjs::lib/tracker.mjs is stale. Run 'npm run build' and commit it."
            exit 1
          }

  qml:
    name: QML (qmllint, qmlformat, QML + HTTP tests) via nix flake check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: nix flake check
        run: nix flake check -L --show-trace

  result:
    name: CI result
    if: always()
    needs: [changes, typescript, qml]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was skipped for a documentation-only change
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
