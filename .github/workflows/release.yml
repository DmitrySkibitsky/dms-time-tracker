name: Release

# A `v*` tag on a commit of `main` publishes a GitHub release with the plugin archive and the
# version's CHANGELOG section. The release process: CONTRIBUTING.md#releases.
on:
  push:
    tags: ['v*']

# One release at a time, and a release is never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Checks and packs; no write access here.
  build:
    name: Check and pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: version
        name: The tag names the plugin version, on a commit of main
        run: |
          version=$(jq -r .version plugin.json)
          package=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ] || [ "$package" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json $version / package.json $package."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main: tag the release commit after its pull request is merged."
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      # The tests ran on this very commit in ci.yml; the release only checks their result.
      - name: CI result passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=CI%20result" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" -lt 1 ]; then
            echo "::error::No successful \"CI result\" check on $GITHUB_SHA. Wait for CI, then re-run this workflow."
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The section changelogen wrote for this version: from its heading to the next one.
          awk -v heading="## v$VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no \"## v$VERSION\" section. Run npm run changelog in the release pull request."
            exit 1
          fi

      - name: Pack the plugin directory
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/timeTracker
          cp -r plugin.json TimeTrackerDaemon.qml TimeTrackerWidget.qml TimeTrackerSettings.qml \
            ui lib translations README.md LICENSE CHANGELOG.md dist/timeTracker/
          (cd dist && zip -qr "timeTracker-v$VERSION.zip" timeTracker)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/timeTracker-v${{ steps.version.outputs.version }}.zip
            release-notes.md
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=""
          [ "$PRERELEASE" = true ] && flags="--prerelease"
          # shellcheck disable=SC2086
          gh release create "v$VERSION" "dist/timeTracker-v$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" --title "v$VERSION" --notes-file release-notes.md $flags
